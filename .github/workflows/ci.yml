name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # Linux amd64
          - os: windows-latest  # Windows amd64
          - os: macos-latest    # macOS arm64 (Apple M-series)

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libglew-dev freeglut3-dev libglm-dev graphicsmagick-libmagick-dev-compat

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install glew freeglut glm graphicsmagick

      - name: Cache vcpkg binary packages
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg_archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg_archives
        run: |
          New-Item -ItemType Directory -Force -Path C:\vcpkg_archives | Out-Null
          vcpkg install glew freeglut glm graphicsmagick pkgconf --triplet x64-windows

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release
