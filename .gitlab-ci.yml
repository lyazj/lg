stages:
  - build

build-linux:
  image: ubuntu:latest
  stage: build
  script:
    - apt-get update
    - apt-get install -y build-essential clang cmake git libgl-dev libglew-dev freeglut3-dev libglm-dev graphicsmagick-libmagick-dev-compat
    - export CC=clang CXX=clang++
    - export BUILD=build_${CC}_$(uname -m)_$(uname -s)_ubuntu_latest_$(git rev-parse --short HEAD)
    - cmake -B ${BUILD} -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build ${BUILD}
    - export CC=gcc CXX=g++
    - export BUILD=build_${CC}_$(uname -m)_$(uname -s)_ubuntu_latest_$(git rev-parse --short HEAD)
    - cmake -B ${BUILD} -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build ${BUILD}
  artifacts:
    paths:
      - build_*/libLG.so
      - build_*/*Example
