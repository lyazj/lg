name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # Linux amd64
          - os: windows-latest  # Windows amd64
          - os: macos-latest    # macOS arm64 (Apple M-series)

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libglew-dev freeglut3-dev libopencv-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glew freeglut opencv

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install glew freeglut opencv --triplet x64-windows

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release
