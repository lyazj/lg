stages:
  - build

build-native:
  image: ubuntu:latest
  stage: build
  script:
    - apt-get update
    - apt-get install -y build-essential cmake git libgl-dev libglew-dev freeglut3-dev libglm-dev graphicsmagick-libmagick-dev-compat libstb-dev libicu-dev
    - ./build.sh
    - mv install/ install-native-$(uname -m)_$(git rev-parse --short HEAD)/
  artifacts:
    paths:
      - install-native-*/bin/
      - install-native-*/lib/
      - install-native-*/share/
    expire_in: 1 week

build-mingw64:
  image: ubuntu:latest
  stage: build
  script:
    - apt-get update
    - apt-get install -y mingw-w64 make cmake git
    - pushd build-cross
    - ./build-mingw64.sh
    - popd
    - mv build-cross/install-mingw64/ install-mingw64-x86_64-$(git rev-parse --short HEAD)/
  artifacts:
    paths:
      - install-mingw64-*/bin/
      - install-mingw64-*/share/
    expire_in: 1 week

build-mingw32:
  image: ubuntu:latest
  stage: build
  script:
    - apt-get update
    - apt-get install -y mingw-w64 make cmake git
    - pushd build-cross
    - ./build-mingw32.sh
    - popd
    - mv build-cross/install-mingw32/ install-mingw32-i686-$(git rev-parse --short HEAD)/
  artifacts:
    paths:
      - install-mingw32-*/bin/
      - install-mingw32-*/share/
    expire_in: 1 week

build-linux32:
  image: ubuntu:latest
  stage: build
  script:
    - dpkg --add-architecture i386
    - apt-get update
    - apt-get install -y g++-i686-linux-gnu make cmake git libgl-dev:i386 libglu1-mesa-dev:i386
    - pushd build-cross
    - ./build-linux32.sh
    - popd
    - mv build-cross/install-linux32/ install-linux32-i686-$(git rev-parse --short HEAD)/
  artifacts:
    paths:
      - install-linux32-*/bin/
      - install-linux32-*/lib/
      - install-linux32-*/share/
    expire_in: 1 week
