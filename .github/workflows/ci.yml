name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # manual trigger

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            enabled: true
          - os: macos-latest
            enabled: ${{ github.event_name == 'workflow_dispatch' }}

    runs-on: ${{ matrix.os }}
    if: ${{ matrix.enabled }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libglu1-mesa-dev libxi-dev libglm-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install glm graphicsmagick icu4c

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Install
        run: cmake --install build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-install
          path: install/
