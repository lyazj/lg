name: CI

on:
  workflow_dispatch:   # manual trigger only

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Show OS and trigger
        run: echo "OS is ${{ matrix.os }}, event is ${{ github.event_name }}"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libglu1-mesa-dev libxi-dev libglm-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install glm graphicsmagick icu4c

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --parallel $(nproc || sysctl -n hw.ncpu)

      - name: Install
        run: cmake --install build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-install
          path: install/
